<html lang="en">
<head>

<body>
<div class="spooky" aria-hidden="true">
  <div class="fog"></div>
  <svg class="bat b1" viewBox="0 0 64 32"><path d="M32 10c-2-4-6-6-6-6 0 4-2 6-2 6-6-6-16-4-24 4 8-2 12 2 12 6 4-4 10-2 12 4 2-4 4-6 8-6s6 2 8 6c2-6 8-8 12-4 0-4 4-8 12-6-8-8-18-10-24-4 0 0-2-2-2-6 0 0-4 2-6 6z"/></svg>
  <svg class="bat b2" viewBox="0 0 64 32"><path d="M32 10c-2-4-6-6-6-6 0 4-2 6-2 6-6-6-16-4-24 4 8-2 12 2 12 6 4-4 10-2 12 4 2-4 4-6 8-6s6 2 8 6c2-6 8-8 12-4 0-4 4-8 12-6-8-8-18-10-24-4 0 0-2-2-2-6 0 0-4 2-6 6z"/></svg>
  <svg class="bat b3" viewBox="0 0 64 32"><path d="M32 10c-2-4-6-6-6-6 0 4-2 6-2 6-6-6-16-4-24 4 8-2 12 2 12 6 4-4 10-2 12 4 2-4 4-6 8-6s6 2 8 6c2-6 8-8 12-4 0-4 4-8 12-6-8-8-18-10-24-4 0 0-2-2-2-6 0 0-4 2-6 6z"/></svg>
</div>
<main id="view" aria-live="polite"></main>
<nav class="tabbar" aria-label="Sections">
  <a href="#spin" data-tab="spin"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="6.5" r="1.6"/><circle cx="12" cy="17.5" r="1.6"/><circle cx="6.5" cy="12" r="1.6"/><circle cx="17.5" cy="12" r="1.6"/></svg><span>Spin</span></a>
  <a href="#party" data-tab="party"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="9" r="3"/><circle cx="16.5" cy="9.5" r="2.5"/><path d="M2.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5M13.5 15.2c.9-.8 1.9-1.2 3-1.2 2.3 0 4.1 1.6 4.6 5"/></svg><span>Party</span></a>
  <a href="#services" data-tab="services"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span>Services</span></a>
  <a href="#watched" data-tab="watched"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg><span>Watched</span></a>
</nav>
<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
  <form method="dialog" class="sheet-inner">
    <div class="sheet-grab" aria-hidden="true"></div>
    <div class="sheet-head"><h3 id="sheetTitle">Filters</h3><button type="button" class="text" data-act="reset">Reset</button></div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot"><button class="big" id="sheetDone" value="done">Show titles</button></div>
  </form>
</dialog>
<div id="toast" role="status" hidden></div>
<script src="/app.js"></script>
</body>
</html>
